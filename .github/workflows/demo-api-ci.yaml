name: Demo API - ARM64 CI and GitOps promotion
on:
  pull_request:
    paths:
      - 'services/demo-api/**'
      - '.github/workflows/demo-api-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'services/demo-api/**'
      - '.github/workflows/demo-api-ci.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/demo-api/requirements-dev.txt
      - name: Unit tests
        working-directory: services/demo-api
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ARM64 container
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/demo-api
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/shark-2000/pi-demo-api:sha-${{ github.sha }}
          provenance: true
      - name: Promote immutable image digest in GitOps manifests
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          path = pathlib.Path("apps/demo-api/deployment.yaml")
          text = path.read_text()
          image = "ghcr.io/shark-2000/pi-demo-api@" + os.environ["IMAGE_DIGEST"]
          new, count = re.subn(
              r"(?m)^(\s*image:)\s+ghcr\.io/shark-2000/pi-demo-api(?:[:@][^\s]+)\s*$",
              lambda m: m.group(1) + " " + image,
              text,
          )
          if count != 1:
              raise SystemExit(f"Expected exactly one demo-api image, found {count}")
          path.write_text(new)
          print(f"Prepared immutable image: {image}")
          PY
      - name: Open GitOps promotion pull request
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/demo-api-image
          delete-branch: true
          commit-message: "chore(gitops): promote demo-api image"
          title: "chore(gitops): promote demo-api ARM64 image"
          body: |
            Built and tested by GitHub Actions.
            This PR pins the Kubernetes image to the immutable GHCR digest.
            Review and merge to let Argo CD deploy it.
          add-paths: apps/demo-api/deployment.yaml
