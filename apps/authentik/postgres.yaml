apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-postgres-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authentik-postgres
spec:
  serviceName: authentik-postgres
  replicas: 1
  selector:
    matchLabels:
      app: authentik-postgres
  template:
    metadata:
      labels:
        app: authentik-postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      containers:
        - name: postgres
          image: postgres:17.6-alpine
          env:
            - name: POSTGRES_DB
              value: authentik
            - name: POSTGRES_USER
              value: authentik
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: AUTHENTIK_POSTGRESQL__PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U authentik -d authentik"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: authentik-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-postgres
spec:
  type: ClusterIP
  selector:
    app: authentik-postgres
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
