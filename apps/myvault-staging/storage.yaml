apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myvault-config
  namespace: myvault-staging
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myvault-downloads
  namespace: myvault-staging
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myvault-data
  namespace: myvault-staging
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
