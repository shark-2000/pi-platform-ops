apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-pi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-pi
  template:
    metadata:
      labels:
        app: hello-pi
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
